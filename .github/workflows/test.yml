            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  upgrade-gate:
    name: Upgrade regression gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0              # harness needs release tags
        persist-credentials: false   # the harness only ever touches a local mirror
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'     # old updaters rebuild the dashboard during apply
    - run: npm install --ignore-scripts
    - name: Upgrade PR gate (newest old release -> this commit)
      run: node upgrade-tests.mjs --pr-gate
    - name: Canary (harness must be able to fail)
      run: node upgrade-tests.mjs --canary
    - name: Local-paths declaration survives a real apply (#2421)
      run: node upgrade-tests.mjs --local-paths
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
